# PhotoCraft 的 OTools 插件 native 适配层。
#
# 与 designcraft / cadcraft / pdfcraft 的差异（**不是照抄**）：上游 `crates/automation`
# 的工具层由 `rmcp` 的 `#[tool_router]` 宏生成，没有独立的 `tool_definitions()` 导出。
# 因此本 crate 不重写任何工具定义，而是在 dylib 内起一个**常驻**的上游 MCP 服务，
# 经内存管道（`serve_io` + `tokio::io::duplex`）与它对话：
#   - tools/list → 拆出 `result.tools` 转给宿主
#   - tools/call → 转发 `{name, arguments}`，把 `result.content` / `isError` 转给宿主
#
# 好处：工具表、严格 schema 校验（`strict_schema`）、后台作业与长任务都跟着上游走，零漂移。
#
# 独立 workspace：上游 workspace 是 wasm/GUI 导向，并进来会把 UI 依赖带进插件构建。
[package]
name = "otools-photocraft-native"
description = "PhotoCraft as an OTools plugin: headless MCP backend driving the upstream photocraft-automation rmcp server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "otools_photocraft_native"

[dependencies]
photocraft-automation = { path = "../upstream/crates/automation" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "macros", "time"] }

# 上游 workspace 的 patch 不会跟着 path 依赖传播：native 的依赖图经 photocraft-automation
# 拉进 hayro/vello 系，必须与 shell 同步这段（上游更新后同步，见 AGENTS.md）。
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
linesweeper = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
vello_common = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
vello_cpu = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
emath = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "f5025284445ea19c35f746d96fc0b75468b3f560" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }


# cdylib 必须可 unwind：插件 FFI 边界在插件内部捕获 panic，
# 若 release profile 设成 abort，宿主会整体被杀。
[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
